<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Balance Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 360px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .balance-box {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="balance-box">
    Balance: $<span id="balance">1000</span>
  </div>

  <div class="field">
    <label for="amount">Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount">
  </div>

  <div class="actions">
    <button id="credit-btn">Credit</button>
    <button id="debit-btn">Debit</button>
  </div>

  <div id="message"></div>

  
  <script>

    function getBalance() {
      return Number(document.getElementById("balance").innerText);
    }

    function printBalance(num) {
      document.getElementById("balance").innerText = num;
    }

    function getAmount() {
      return Number(document.getElementById("amount").value);
    }

    function showMessage(text) {
      document.getElementById("message").innerText = text;
    }

    function clearAmount() {
      document.getElementById("amount").value = "";
    }


    function isAmountValid() {
      var typed = document.getElementById("amount").value;

      if (typed == "") {
        showMessage("Please enter an amount.");
        return false;
      } else if (Number(typed) <= 0) {
        showMessage("Amount must be more than zero.");
        return false;
      }

      return true;
    }


    document.getElementById("credit-btn").addEventListener("click", function () {
      if (isAmountValid() == false) {
        return;
      }

      var amount = getAmount();
      var newBalance = getBalance() + amount;

      printBalance(newBalance);
      showMessage("Credited " + amount + " successfully.");
      clearAmount();
    });


    document.getElementById("debit-btn").addEventListener("click", function () {
      if (isAmountValid() == false) {
        return;
      }

      var amount = getAmount();

      
      if (amount > getBalance()) {
        showMessage("Not enough balance.");
        return;
      }

      var newBalance = getBalance() - amount;

      printBalance(newBalance);
      showMessage("Debited " + amount + " successfully.");
      clearAmount();
    });
  </script>
</body>
</html>
